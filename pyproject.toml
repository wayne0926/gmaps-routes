[project]
name = "gmaps-routes"
version = "0.4.0"
description = "Google Maps routing (transit/bike first) for LLMs: CLI + stdio MCP server"
requires-python = ">=3.10"
dependencies = ["requests", "tzdata"]  # tzdata: legacy zone names Google returns (Europe/Kiev)

[project.optional-dependencies]
mcp = ["mcp>=1.10,<3"]
test = ["pytest"]

[project.scripts]
gmaps-routes = "gmaps_routes.cli:main"
gmaps-routes-mcp = "gmaps_routes.mcp_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gmaps_routes"]
