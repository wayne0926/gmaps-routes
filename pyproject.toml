[project]
name = "gmaps-routes"
version = "0.1.0"
description = "Full-featured Google Maps Routes API wrapper (CLI + MCP server)"
requires-python = ">=3.10"
dependencies = ["requests"]

[project.optional-dependencies]
mcp = ["mcp"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gmaps_routes"]
